aid: oper
name: Oper
description: 'Oper (Oper Credits) is a Belgium-based fintech that provides digital mortgage
  origination software for banks, lenders, brokers and insurers. Its modular Oper Connect
  platform connects every stakeholder in the mortgage value chain, and its Herman AI
  underwriting agent automates document classification, data extraction, verification
  and credit-policy application to shorten time-to-decision. The Oper Connect API is a
  JWT-authenticated REST API (Django REST Framework style) exposing loan requests, clients,
  offers, financial plans, documents and hundreds of configuration resources, plus a
  versioned Loan Request Webhook API for pushing loan events to lender systems.'
url: https://raw.githubusercontent.com/api-evangelist/oper/refs/heads/main/apis.yml
